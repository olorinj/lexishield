[package]
name = "lexishield-gui"
version = "1.0.0"
description = "Interfaz Grafica de Usuario (GUI) de LexiShield"
authors = ["Julio C. Semper"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
lexishield = { path = ".." }
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
dirs = "5.0"
rpassword = "7.3"
rayon = "1.10"
mimalloc = { version = "0.1", default-features = false }
ignore = "0.4"
arboard = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

