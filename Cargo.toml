[package]
name = "lexishield"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.10"
indicatif = "0.17"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1.11"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
once_cell = "1.20"
arboard = "3"
ctrlc = "3.4"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rpassword = "7.3"
toml = "0.8"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
