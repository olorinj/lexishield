[package]
name = "lexishield"
version = "1.0.0"
edition = "2024"
authors = ["Julio C. Semper"]
description = "Motor de anonimización y ofuscación semántica de alto rendimiento para consultas de IA y sanitización de datos"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/olorinj/lexishield"
homepage = "https://gitlab.com/olorinj/lexishield"
documentation = "https://docs.rs/lexishield"
keywords = ["anonymization", "obfuscation", "privacy", "security", "cli"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[dependencies]
rayon = "1.10"
indicatif = "0.17"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.41", features = ["serialize"] }
regex = "1.11"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
arboard = "3"
ctrlc = "3.4"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rpassword = "7.3"
toml = "0.8"
mimalloc = { version = "0.1", default-features = false }
clap_complete = "4.5"
ignore = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "engine_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
