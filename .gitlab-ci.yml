# Pipeline de CI/CD de GitLab para LexiShield (Rust)
stages:
  - lint
  - test
  - coverage
  - build
  - release

# Imagen base oficial de Rust para compilar y probar
image: rust:1.85-slim

# Caché global de dependencias de Cargo para acelerar los pipelines
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - target/
    - /usr/local/cargo/registry/
    - /usr/local/cargo/git/

before_script:
  - apt-get update -yqq && apt-get install -yqq pkg-config libssl-dev libx11-dev libxcb1-dev libxext-dev

# -------------------------------------------------------------
# 1. Fase de Verificación y Linting
# -------------------------------------------------------------
formatting:
  stage: lint
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check

linting:
  stage: lint
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings

security_audit:
  stage: lint
  script:
    - cargo install cargo-audit --locked || true
    - cargo audit

# -------------------------------------------------------------
# 2. Fase de Pruebas Automatizadas
# -------------------------------------------------------------
unit_and_integration_tests:
  stage: test
  script:
    - cargo test --verbose

# -------------------------------------------------------------
# 3. Fase de Cobertura de Código (Code Coverage)
# -------------------------------------------------------------
coverage_report:
  stage: coverage
  allow_failure: true
  script:
    - cargo install cargo-tarpaulin || true
    - cargo tarpaulin --out Xml --out Html --output-dir dist/coverage --ignore-tests
  coverage: '/^\d+.\d+% coverage/'
  artifacts:
    name: "coverage-$CI_COMMIT_REF_NAME"
    paths:
      - dist/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: dist/coverage/cobertura.xml
    expire_in: 30 days

# -------------------------------------------------------------
# 3. Fase de Compilación y Generación de Binarios
# -------------------------------------------------------------
build_linux_x86_64:
  stage: build
  script:
    - cargo build --release
    - mkdir -p dist
    - cp target/release/lexishield dist/lexishield-linux-amd64
    - chmod +x dist/lexishield-linux-amd64
  artifacts:
    name: "lexishield-$CI_COMMIT_REF_NAME-linux-amd64"
    paths:
      - dist/lexishield-linux-amd64
    expire_in: 30 days

# -------------------------------------------------------------
# 4. Fase de Publicación / Release (Solo al crear Tags: vX.Y.Z)
# -------------------------------------------------------------
gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script: [] # No requiere dependencias de Rust
  script:
    - echo "Generando Release oficial para la versión $CI_COMMIT_TAG"
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Binarios y artefactos generados automáticamente para $CI_COMMIT_TAG."
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "lexishield-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/lexishield-linux-amd64"

