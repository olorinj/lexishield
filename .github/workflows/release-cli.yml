name: "Lanzamiento LexiShield (Solo CLI)"
on:
  push:
    tags:
      - 'v1.0.0.0'
jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Renombrar binario
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv target/release/lexishield.exe lexishield-${{ runner.os }}.exe
          else
            mv target/release/lexishield lexishield-${{ runner.os }}
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: lexishield-*
          draft: true
