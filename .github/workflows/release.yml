name: "Lanzamiento LexiShield (Multiplataforma)"

on:
  push:
    tags:
      - 'v*' # Se ejecuta automáticamente al subir una etiqueta de versión (ej: v1.0.0)

jobs:
  compilar-gui:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Instalar dependencias del sistema (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalar dependencias web y compilar frontend
        run: |
          npm install --no-package-lock
          npm run build
        working-directory: ui

      - name: Compilar Tauri y Subir a GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LexiShield ${{ github.ref_name }}"
          releaseBody: "Esta es la nueva versión de LexiShield. Selecciona el instalador (.msi, .deb, .AppImage, .dmg) que corresponda a tu sistema operativo."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: "src-tauri"

