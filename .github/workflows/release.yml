name: "Lanzamiento LexiShield (Multiplataforma)"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta de la versión a publicar (ej: v2.0.1)"
        required: false
        default: "v2.0.1"
  push:
    tags:
      - 'v*' # Se ejecuta automáticamente al subir una etiqueta de versión (ej: v1.0.0)

permissions:
  contents: write

jobs:
  compilar-gui:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Instalar dependencias del sistema (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Compilar binario CLI
        shell: bash
        run: |
          mkdir -p dist-cli
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cargo build --release --bin lexishield
            cp target/release/lexishield.exe dist-cli/lexishield-windows-amd64.exe
          elif [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            cargo build --release --bin lexishield
            cp target/release/lexishield dist-cli/lexishield-linux-amd64
            chmod +x dist-cli/lexishield-linux-amd64
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cargo build --release --bin lexishield ${{ matrix.args }}
            if [[ "${{ matrix.args }}" =~ "aarch64" ]]; then
              cp target/aarch64-apple-darwin/release/lexishield dist-cli/lexishield-darwin-arm64
              chmod +x dist-cli/lexishield-darwin-arm64
            else
              cp target/x86_64-apple-darwin/release/lexishield dist-cli/lexishield-darwin-amd64
              chmod +x dist-cli/lexishield-darwin-amd64
            fi
          fi

      - name: Instalar dependencias web y compilar frontend
        run: |
          npm install
          npm run build
        working-directory: ui

      - name: Compilar Tauri y Subir a GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_WINRES: "1"
          SKIP_WIN_RESOURCE: "1"
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_tag || 'v2.0.1') || github.ref_name }}
          releaseName: "LexiShield ${{ github.event_name == 'workflow_dispatch' && (inputs.release_tag || 'v2.0.1') || github.ref_name }}"
          releaseBody: "Esta es la nueva versión de LexiShield. Contiene los instaladores de interfaz gráfica (.msi, .deb, .AppImage, .dmg) y los binarios de consola (CLI) independientes."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: "src-tauri"

      - name: Subir binarios CLI a GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_tag || 'v2.0.1') || github.ref_name }}
        run: |
          if [ -d dist-cli ] && [ "$(ls -A dist-cli)" ]; then
            echo "Subiendo binarios CLI a la release de GitHub (${TAG_NAME})..."
            gh release upload "${TAG_NAME}" dist-cli/* --clobber
          fi


